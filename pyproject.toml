[project]
name = "smartreceipt"
version = "0.1.0"
description = "Offline-first receipt scanning and budgeting desktop app"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "SmartReceipt Contributors"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial"
]
dependencies = [
  "PyQt6>=6.6.1",
  "pytesseract>=0.3.10",
  "Pillow>=10.1.0",
  "opencv-python>=4.8.1",
  "matplotlib>=3.8.1",
  "pandas>=2.1.2",
  "reportlab>=4.0.8",
  "SQLAlchemy>=2.0.23"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "black>=23.10",
  "ruff>=0.1.5"
]

[build-system]
requires = ["setuptools>=68.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B"]
ignore = ["E501"]

